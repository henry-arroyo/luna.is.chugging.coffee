AWSTemplateFormatVersion: '2010-09-09'
Description: >
  SOCU training game - keyless deploy access. Deploy once with an admin console login
  (see setup-access.sh). Creates the scoped CloudFormation execution policy used by the
  "socugame" CDK bootstrap, and the deployer role that Claude Code assumes to run cdk deploy.

Parameters:
  Qualifier:
    Type: String
    Default: socugame
    Description: CDK bootstrap qualifier. Must match cdk.json.

Resources:
  # The most any role created by the SocuGame-* stacks can ever do, whatever its own policies say.
  # The execution policy below only lets CloudFormation create or change roles that carry this boundary,
  # so a stack can't mint an admin role (or one trusted by another account) and act through it.
  # Covers the stacks' Lambda custom resources (site file copy, bucket auto-delete, log retention),
  # AppSync's logging role, and the host-password authorizer (which reads one SSM parameter).
  RoleBoundary:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: socu-role-boundary
      Description: SOCU game - permissions boundary for every role the SocuGame-* stacks create
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: SiteBucket
            Effect: Allow
            Action: s3:*
            Resource:
              - arn:aws:s3:::socugame-*
              - arn:aws:s3:::socugame-*/*
          - Sid: ReadCdkAssets
            Effect: Allow
            Action: [s3:GetObject*, s3:GetBucket*, s3:List*]
            Resource:
              - !Sub arn:aws:s3:::cdk-${Qualifier}-assets-${AWS::AccountId}-us-east-1
              - !Sub arn:aws:s3:::cdk-${Qualifier}-assets-${AWS::AccountId}-us-east-1/*
          - Sid: Invalidate
            Effect: Allow
            Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
            Resource: '*'
          - Sid: OwnLogs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
              - logs:DescribeLogStreams
              - logs:PutRetentionPolicy
              - logs:DeleteRetentionPolicy
            Resource:
              - !Sub arn:aws:logs:us-east-1:${AWS::AccountId}:log-group:/aws/appsync/*
              - !Sub arn:aws:logs:us-east-1:${AWS::AccountId}:log-group:/aws/lambda/SocuGame-*
          - Sid: HostPasswordHash
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/socugame/*

  # What CloudFormation itself may do when deploying the SocuGame-* stacks.
  # Passed to `cdk bootstrap --cloudformation-execution-policies`, replacing the default AdministratorAccess.
  ExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: socu-cdk-execution
      Description: SOCU game - CloudFormation execution permissions (us-east-1, SocuGame-* only)
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # AppSync, CloudFront and ACM: full control only of resources tagged project=mcfcu-socu-training
          # (CDK tags everything in the app), and creating them only with that tag. So a deploy can't
          # change or delete another project's APIs, distributions or certificates in this account.
          - Sid: ProjectResources
            Effect: Allow
            Action: [appsync:*, cloudfront:*, acm:*]
            Resource:
              - !Sub arn:aws:appsync:us-east-1:${AWS::AccountId}:apis/*
              - !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/*
              - !Sub arn:aws:acm:us-east-1:${AWS::AccountId}:certificate/*
            Condition:
              StringEquals: { aws:ResourceTag/project: mcfcu-socu-training }
          - Sid: CreateTagged
            Effect: Allow
            Action:
              - appsync:CreateApi
              - appsync:CreateChannelNamespace
              - appsync:TagResource
              - cloudfront:CreateDistribution
              - cloudfront:TagResource
              - acm:RequestCertificate
              - acm:AddTagsToCertificate
            Resource: '*'
            Condition:
              StringEquals:
                aws:RequestedRegion: us-east-1
                aws:RequestTag/project: mcfcu-socu-training
          # IAM can't scope these by tag or name: AppSync API keys, CloudFront origin access controls and
          # response-headers policies. Plus read-only lookups.
          - Sid: Untaggable
            Effect: Allow
            Action:
              - appsync:CreateApiKey
              - appsync:UpdateApiKey
              - appsync:DeleteApiKey
              - appsync:Get*
              - appsync:List*
              - cloudfront:*OriginAccessControl*
              - cloudfront:*ResponseHeadersPolicy*
              - cloudfront:Get*
              - cloudfront:List*
              - acm:Describe*
              - acm:Get*
              - acm:List*
            Resource: '*'
            Condition:
              StringEquals: { aws:RequestedRegion: us-east-1 }
          - Sid: OwnLogs
            Effect: Allow
            Action: logs:*
            Resource:
              - !Sub arn:aws:logs:us-east-1:${AWS::AccountId}:log-group:/aws/appsync/*
              - !Sub arn:aws:logs:us-east-1:${AWS::AccountId}:log-group:/aws/lambda/SocuGame-*
          - Sid: ListLogs
            Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: '*'
          - Sid: SiteBucket
            Effect: Allow
            Action: s3:*
            Resource:
              - arn:aws:s3:::socugame-*
              - arn:aws:s3:::socugame-*/*
            Condition:
              StringEquals: { aws:RequestedRegion: us-east-1 }
          - Sid: ReadCdkAssets
            Effect: Allow
            Action: [s3:GetObject, s3:GetObjectVersion]
            Resource: !Sub arn:aws:s3:::cdk-${Qualifier}-assets-${AWS::AccountId}-us-east-1/*
          - Sid: StackFunctions
            Effect: Allow
            Action: lambda:*
            Resource:
              - !Sub arn:aws:lambda:us-east-1:${AWS::AccountId}:function:SocuGame-*
          - Sid: StackLayers
            Effect: Allow
            Action: [lambda:PublishLayerVersion, lambda:DeleteLayerVersion, lambda:GetLayerVersion, lambda:ListLayerVersions]
            Resource:
              # The AWS CLI layers used by the stacks' file-copy custom resources
              - !Sub arn:aws:lambda:us-east-1:${AWS::AccountId}:layer:*AwsCliLayer*
          # Anything that creates a role or adds permissions to one requires the boundary above.
          - Sid: GrantOnlyWithinBoundary
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:PutRolePolicy
              - iam:PutRolePermissionsBoundary
            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:role/SocuGame-Cert-*
              - !Sub arn:aws:iam::${AWS::AccountId}:role/SocuGame-Site-*
              - !Sub arn:aws:iam::${AWS::AccountId}:role/SocuGame-Game-*
            Condition:
              StringEquals: { iam:PermissionsBoundary: !Ref RoleBoundary }
          # Reading, tagging and removing permissions can't widen access, so no boundary check
          # (and roles made before the boundary existed can still be cleaned up).
          - Sid: StackRoles
            Effect: Allow
            Action:
              - iam:DeleteRole
              - iam:GetRole
              - iam:UpdateRole
              - iam:TagRole
              - iam:UntagRole
              - iam:DeleteRolePolicy
              - iam:DetachRolePolicy
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:role/SocuGame-Cert-*
              - !Sub arn:aws:iam::${AWS::AccountId}:role/SocuGame-Site-*
              - !Sub arn:aws:iam::${AWS::AccountId}:role/SocuGame-Game-*
          - Sid: OnlyTheseManagedPolicies
            Effect: Allow
            Action: iam:AttachRolePolicy
            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:role/SocuGame-Site-*
              - !Sub arn:aws:iam::${AWS::AccountId}:role/SocuGame-Game-*
            Condition:
              StringEquals: { iam:PermissionsBoundary: !Ref RoleBoundary }
              ArnEquals:
                iam:PolicyARN:
                  - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                  - arn:aws:iam::aws:policy/service-role/AWSAppSyncPushToCloudWatchLogs
          - Sid: PassStackRoles
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - !Sub arn:aws:iam::${AWS::AccountId}:role/SocuGame-Site-*
              - !Sub arn:aws:iam::${AWS::AccountId}:role/SocuGame-Game-*
            Condition:
              StringEquals:
                iam:PassedToService: [lambda.amazonaws.com, appsync.amazonaws.com]
          - Sid: BootstrapVersion
            Effect: Allow
            Action: [ssm:GetParameter, ssm:GetParameters]
            Resource: !Sub arn:aws:ssm:us-east-1:${AWS::AccountId}:parameter/cdk-bootstrap/${Qualifier}/*

  # The identity Claude Code uses. It can only assume this app's CDK bootstrap roles
  # (which then act through the execution policy above), plus read-only status checks.
  DeployerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: socu-claude-deployer
      Description: SOCU game - assumed by Claude Code to run cdk deploy/destroy for SocuGame-* stacks
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root' }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: socu-deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: UseCdkBootstrapRoles
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/cdk-${Qualifier}-*
              - Sid: ReadStatus
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:ListStackResources
                  - cloudformation:GetTemplate
                  - acm:ListCertificates
                  - acm:DescribeCertificate
                  - cloudfront:GetDistribution
                  - cloudfront:ListDistributions
                  - cloudfront:GetInvalidation
                  - appsync:GetApi
                  - appsync:ListApis
                  - appsync:ListChannelNamespaces
                  - logs:DescribeLogGroups
                  - logs:FilterLogEvents
                  - logs:GetLogEvents
                Resource: '*'
                Condition:
                  StringEquals: { aws:RequestedRegion: us-east-1 }
      Tags:
        - { Key: project, Value: mcfcu-socu-training }

Outputs:
  ExecutionPolicyArn:
    Value: !Ref ExecutionPolicy
  RoleBoundaryArn:
    Value: !Ref RoleBoundary
  DeployerRoleArn:
    Value: !GetAtt DeployerRole.Arn
